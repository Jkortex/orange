# 限界上下文快照模版 (Context Snapshot Template)
# 用途：固化历经多次生成-审查-纠偏迭代后的限界上下文稳定状态。
# 它是后续任何针对本上下文开展的 AI 协作（写代码、建表、定义 API）的第一手输入资产。
# 存放位置建议：项目仓库 docs/ddd/contexts/<context-name>-snapshot.yaml

bounded_context: <BoundedContextName> # 例如: Order Management
version: 1.0.0
last_refined: "2026-10-24"

purpose:
  - "<本上下文的核心业务使命，例如：管理客户订单生命周期，守护订单确认与取消的不变量>"

owned_concepts:
  aggregates:
    confirmed:
      - <OwnedAggregate1> # 例如: Order
    proposed: []

  commands:
    confirmed:
      user_initiated:
        - <CommandUserInitiated1> # 例如: SubmitOrder
      policy_triggered:
        - <CommandPolicyTriggered1> # 例如: ConfirmOrder
    proposed:
      user_initiated:
        - <ProposedCommand1> # 例如: CancelOrder
      policy_triggered:
        - <ProposedCommand2> # 例如: ExpireOrder

  internal_events:
    confirmed:
      - <InternalEvent1> # 例如: OrderSubmitted
      - <InternalEvent2> # 例如: OrderConfirmed
    proposed:
      - <ProposedEvent1> # 例如: OrderCancelled
      - <ProposedEvent2> # 例如: OrderExpired

external_inputs:
  - <ExternalEvent1> # 例如: PaymentAuthorized (来自支付上下文)
  - <ExternalEvent2> # 例如: StockReserved (来自库存上下文)
  - <ExternalEvent3> # 例如: StockReservationFailed (来自库存上下文)

policies:
  confirmed:
    - "<业务反应规则，例如：当观察到 PaymentAuthorized 且 StockReserved 均成功时，触发 ConfirmOrder>"

ownership_constraints:
  - "<外部概念1> 严禁归属为本上下文拥有的聚合。"
  - "<外部概念2> 严禁归属为本上下文拥有的聚合。"
  - "外部输入绝不能建模为内部聚合抛出的事件。"
  - "协作绝不意味着拥有：本上下文可以观察外部事实，但不得占有产生该事实的业务流程。"

open_questions:
  - "<未决问题1: 例如库存预留失败后，订单应立即取消还是发起重试？>"
  - "<未决问题2: 订单在未确认状态下最多允许保留多久？>"
