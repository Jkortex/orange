<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <style>
      .bg-box { fill: var(--card, #ffffff); stroke: var(--border, #e2e8f0); stroke-width: 2; rx: 12px; }
      .client-box { fill: color-mix(in oklab, var(--primary, #3b82f6) 10%, transparent); stroke: var(--primary, #3b82f6); stroke-width: 2; rx: 10px; }
      .service-box { fill: color-mix(in oklab, var(--accent, #8b5cf6) 10%, transparent); stroke: var(--accent, #8b5cf6); stroke-width: 2; rx: 10px; }
      .db-box { fill: color-mix(in oklab, var(--muted, #64748b) 12%, transparent); stroke: var(--muted-foreground, #64748b); stroke-width: 2; rx: 10px; }
      .label-title { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: var(--foreground, #0f172a); }
      .label-sub { font-family: system-ui, sans-serif; font-size: 12px; fill: var(--muted-foreground, #64748b); }
      .arrow { stroke: var(--primary, #3b82f6); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrowhead { fill: var(--primary, #3b82f6); }
      .boundary { stroke: var(--border, #cbd5e1); stroke-width: 1.5; stroke-dasharray: 6 6; fill: none; rx: 16px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arrowhead" />
    </marker>
  </defs>

  <!-- 总体区域边界 -->
  <rect x="20" y="20" width="760" height="380" class="bg-box" />
  <rect x="220" y="45" width="530" height="330" class="boundary" />
  <text x="240" y="75" class="label-sub" font-weight="600">云原生后端集群 / VPC Boundary</text>

  <!-- 客户端层 -->
  <g transform="translate(50, 160)">
    <rect x="0" y="0" width="130" height="70" class="client-box" />
    <text x="65" y="32" text-anchor="middle" class="label-title">Web / App</text>
    <text x="65" y="52" text-anchor="middle" class="label-sub">用户客户端</text>
  </g>

  <!-- API 网关 -->
  <g transform="translate(250, 160)">
    <rect x="0" y="0" width="130" height="70" class="service-box" />
    <text x="65" y="32" text-anchor="middle" class="label-title">API Gateway</text>
    <text x="65" y="52" text-anchor="middle" class="label-sub">反向代理 &amp; 鉴权</text>
  </g>

  <!-- 微服务 A -->
  <g transform="translate(440, 100)">
    <rect x="0" y="0" width="130" height="65" class="service-box" />
    <text x="65" y="30" text-anchor="middle" class="label-title">文章服务</text>
    <text x="65" y="48" text-anchor="middle" class="label-sub">Post Service</text>
  </g>

  <!-- 微服务 B -->
  <g transform="translate(440, 220)">
    <rect x="0" y="0" width="130" height="65" class="service-box" />
    <text x="65" y="30" text-anchor="middle" class="label-title">搜索服务</text>
    <text x="65" y="48" text-anchor="middle" class="label-sub">Search Engine</text>
  </g>

  <!-- 存储/缓存 -->
  <g transform="translate(620, 100)">
    <rect x="0" y="0" width="110" height="65" class="db-box" />
    <text x="55" y="30" text-anchor="middle" class="label-title">PostgreSQL</text>
    <text x="55" y="48" text-anchor="middle" class="label-sub">主数据库</text>
  </g>

  <g transform="translate(620, 220)">
    <rect x="0" y="0" width="110" height="65" class="db-box" />
    <text x="55" y="30" text-anchor="middle" class="label-title">Redis Cluster</text>
    <text x="55" y="48" text-anchor="middle" class="label-sub">分布式缓存</text>
  </g>

  <!-- 连线与箭头 -->
  <path d="M 180 195 L 250 195" class="arrow" marker-end="url(#arrow)" />
  <path d="M 380 180 L 440 135" class="arrow" marker-end="url(#arrow)" />
  <path d="M 380 210 L 440 250" class="arrow" marker-end="url(#arrow)" />
  <path d="M 570 135 L 620 135" class="arrow" marker-end="url(#arrow)" />
  <path d="M 570 250 L 620 250" class="arrow" marker-end="url(#arrow)" />
</svg>
